# Sürüm: "v0.1.0" gibi bir etiket (tag) push edilince eklentiyi derler ve zip'ini
# GitHub Release'e ekler. Kullanıcılar zip'i indirip "Paketlenmemiş öğe yükle" ile kurar.
#
#   git switch main && git pull
#   git tag v0.1.0 && git push origin v0.1.0
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write # Release oluşturmak için

jobs:
  release:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run zip
      - uses: softprops/action-gh-release@v2
        with:
          files: extension/.output/*-chrome.zip
          generate_release_notes: true
